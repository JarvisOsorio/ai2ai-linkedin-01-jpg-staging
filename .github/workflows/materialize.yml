name: Materialize LinkedIn 01 JPG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JPG, verify, commit, clean workflow
        run: |
          set -euo pipefail
          out=linkedin-01-authority-first-commitment-gate.jpg
          curl -fsSL --retry 5 --retry-delay 2 -A 'Mozilla/5.0' \
            https://n.uguu.se/tKDBADEg.jpg -o "$out"
          sz=$(wc -c < "$out" | tr -d ' ')
          test "$sz" = "273864"
          python3 -c '
import sys,hashlib,os
p=sys.argv[1]; d=open(p,"rb").read()
assert d[:3]==b"\xff\xd8\xff"
assert hashlib.sha256(d).hexdigest()=="1f9f7478f837fe4385e062a4c83224e4a8239e1301e8fd5e46b42d1d53839f5d"
print("ok", os.path.getsize(p))
' "$out"
          rm -f .github/workflows/materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$out" .github/workflows/materialize.yml
          git commit -m "Materialize LinkedIn 01 JPG"
          git push
